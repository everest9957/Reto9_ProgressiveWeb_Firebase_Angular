<form (ngSubmit)="onSubmit()" class="task-form">
  <input
    type="text"
    [(ngModel)]="title"
    name="title"
    placeholder="Título de la tarea"
    required
  />
  <input
    type="text"
    [(ngModel)]="description"
    name="description"
    placeholder="Descripción (opcional)"
  />
  <button type="submit">Agregar</button>
</form>
