<div class="container">
  <header>
    <h1>📝 {{ title }}</h1>
    <p>Lista de tareas con Angular + PWA + Firebase</p>
  </header>

  <div class="status" [class.offline]="!isOnline()">
    <span *ngIf="isOnline()">🟢 En línea</span>
    <span *ngIf="!isOnline()">🔴 Sin conexión — cambios guardados localmente</span>
    <span *ngIf="pendingSyncCount() > 0" class="pending">
      · ⏳ {{ pendingSyncCount() }} pendiente(s) de sincronizar
    </span>
  </div>

  <main>
    <app-task-form (taskAdded)="onTaskAdded($event)"></app-task-form>
    <app-task-list></app-task-list>
  </main>

  <footer>
    <small>Reto 9 — Código Samurái</small>
  </footer>
</div>
